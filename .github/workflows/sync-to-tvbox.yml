name: Sincronizar com TV Box Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sync-tvbox
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout E-commerce
        uses: actions/checkout@v4
        with:
          path: ecommerce-src

      - name: Checkout TV Box Hub
        uses: actions/checkout@v4
        with:
          repository: Proddy-0/labs-tvbox
          token: ${{ secrets.SYNC_TOKEN }}
          path: tvbox-hub

      - name: Sincronizar arquivos para a pasta /ecommerce no Hub
        run: |
          set -euo pipefail
          mkdir -p tvbox-hub/ecommerce
          rsync -av --delete \
            --exclude='.git' --exclude='.github' \
            ecommerce-src/ tvbox-hub/ecommerce/

      - name: Commit e Push no TV Box Hub
        working-directory: tvbox-hub
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ecommerce/
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao para commitar."
            exit 0
          fi
          git commit -m "Auto-sync: update ecommerce from Proddy-0/E-commerce@${{ github.sha }}"
          git pull --rebase origin main
          git push origin main
